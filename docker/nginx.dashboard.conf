# docker/nginx.dashboard.conf
#
# Serves the dashboard's static build and proxies its API calls
# through to the gateway container (reachable as "gateway" on the
# Docker Compose network) — the dashboard's own JS never needs to know
# the gateway's real address, it just calls relative paths.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /cache {
        proxy_pass http://gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /cluster {
        proxy_pass http://gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://gateway:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: any route that isn't a real static file or one
    # of the proxied API paths above falls back to index.html so
    # client-side routing (if added later) keeps working on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}